<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI Smartboard Pro</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="manifest" href="./manifest.json">
</head>
<body>
  <canvas id="board"></canvas>

  <!-- Floating Toolbar -->
  <div id="toolbar">
    <!-- Drawing Tools -->
    <div class="tool-group">
      <button class="tool active" data-tool="pen" title="Pen">🖊️</button>
      <button class="tool" data-tool="marker" title="Marker">🖍️</button>
      <button class="tool" data-tool="highlighter" title="Highlighter">🟨</button>
      <button class="tool" data-tool="eraser" title="Eraser">🧽</button>
    </div>

    <!-- Shapes -->
    <div class="tool-group">
      <button class="tool" data-tool="line" title="Line">➖</button>
      <button class="tool" data-tool="rect" title="Rectangle">⬜</button>
      <button class="tool" data-tool="circle" title="Circle">◯</button>
    </div>

    <!-- Properties (Color & Size) -->
    <div class="tool-group properties">
      <input type="color" id="colorPicker" value="#000000" title="Color Picker">
      <input type="range" id="sizePicker" min="1" max="100" value="4" title="Brush Size">
    </div>

    <!-- Actions -->
    <div class="tool-group">
      <button id="btnUndo" title="Undo">↩️ Undo</button>
      <button id="btnRedo" title="Redo">↪️ Redo</button>
      <button id="btnClear" title="Clear Board">🗑️ Clear</button>
      <button id="btnExport" title="Export Image">💾 Save</button>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => {
          console.error('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
