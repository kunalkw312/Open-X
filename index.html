<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SmartBoard Pro - Teacher Edition</title>
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#18392b">
  <!-- Load jsPDF for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>



  <!-- MAIN CANVAS -->
  <canvas id="board"></canvas>

  <!-- TOP HEADER MENU -->
  <header class="top-bar">
    <div class="top-bar-left">
      <div class="brand">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h20v14H2z"></path><path d="M12 17v4"></path><path d="M8 21h8"></path></svg>
        <span>BoardPro</span>
      </div>
      
      <div class="divider"></div>

      <!-- Pagination Controls -->
      <div class="pagination-controls">
        <button id="btnPrevPage" class="icon-btn disabled" title="Previous Page">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span id="pageDisplay">1/1</span>
        <button id="btnNextPage" class="icon-btn disabled" title="Next Page">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="9 18 15 12 9 6"></polyline></svg>
        </button>
        <button id="btnAddPage" class="icon-btn" title="Add New Page">
          <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>

      <div class="divider"></div>

      <!-- Board Background Settings -->
      <div class="dropdown-container">
        <button id="btnBgSettings" class="text-btn" title="Board Background Settings">
          <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
          Background
        </button>
        <div id="bgDropdownMenu" class="dropdown-menu hidden">
          <div class="dropdown-section">
            <span class="dropdown-label">Board Color</span>
            <div class="bg-presets">
              <button id="btnBgGreen" class="bg-preset-btn active" data-bg="#18392b" style="background-color: #18392b;" title="Chalkboard Green"></button>
              <button id="btnBgBlack" class="bg-preset-btn" data-bg="#121212" style="background-color: #121212;" title="Blackboard"></button>
              <button id="btnBgWhite" class="bg-preset-btn" data-bg="#ffffff" style="background-color: #ffffff; border: 1px solid #ccc;" title="Whiteboard"></button>
            </div>
            <div class="custom-color-row">
              <span class="dropdown-label" style="margin-bottom: 0;">Custom:</span>
              <input type="color" id="bgCustomColorPicker" value="#18392b">
            </div>
          </div>
          <div class="dropdown-section">
            <span class="dropdown-label">Board Pattern</span>
            <div class="pattern-presets">
              <button id="btnPatternPlain" class="pattern-preset-btn active" data-pattern="plain">Plain</button>
              <button id="btnPatternGrid" class="pattern-preset-btn" data-pattern="grid">Grid</button>
              <button id="btnPatternLines" class="pattern-preset-btn" data-pattern="lines">Ruled</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="top-bar-right">
      <!-- Undo / Redo / Clear -->
      <button id="btnUndo" class="icon-btn" title="Undo (Ctrl+Z)">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3l-3 2.7"></path></svg>
      </button>
      <button id="btnRedo" class="icon-btn" title="Redo (Ctrl+Y)">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
      </button>
      <button id="btnClear" class="icon-btn danger-btn" title="Clear Page">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>

      <div class="divider"></div>

      <!-- Import / Export Controls -->
      <button id="btnOpenDoc" class="icon-btn" title="Open Document">
        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 15v4c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
      </button>
      <input type="file" id="projectInput" accept=".oxsb" style="display: none;">

      <div class="dropdown-container">
        <button id="btnMainExport" class="primary-btn">
          Export <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
        <div id="exportDropdownMenu" class="dropdown-menu align-right hidden">
          <button id="btnSaveCurrent" class="dropdown-item">Save Current Page (.oxsb)</button>
          <button id="btnSaveAll" class="dropdown-item">Save Document (.oxsb)</button>
          <button id="btnExportPDF" class="dropdown-item pdf-item">Export as PDF</button>
        </div>
      </div>
    </div>
  </header>

  <!-- LEFT TOOLBAR -->
  <aside class="toolbar">
    <button class="tool" data-tool="select" title="Select / Move">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"></path><path d="M13 13l6 6"></path></svg>
    </button>
    <div class="tool-divider"></div>
    <button class="tool active" data-tool="pen" title="Pen">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 19l7-7 3 3-7 7-3-3z"></path><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"></path><path d="M2 2l7.586 7.586"></path><circle cx="11" cy="11" r="2"></circle></svg>
    </button>
    <button class="tool" data-tool="marker" title="Thick Marker">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
    </button>
    <button class="tool" data-tool="highlighter" title="Highlighter">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path></svg>
    </button>
    <button class="tool" data-tool="eraser" title="Eraser (or use palm)">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 20H7L3 16C2.5 15.5 2.5 14.5 3 14L13 4C13.5 3.5 14.5 3.5 15 4L20 9C20.5 9.5 20.5 10.5 20 11L11 20H20V20Z"></path></svg>
    </button>
    <div class="tool-divider"></div>
    <button class="tool" data-tool="line" title="Line">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
    </button>
    <button class="tool" data-tool="rect" title="Rectangle">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
    </button>
    <button class="tool" data-tool="circle" title="Circle">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"></circle></svg>
    </button>
    <div class="tool-divider"></div>
    <button class="tool" data-tool="text" title="Text Box">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
    </button>
    <button class="tool" data-tool="sticky" title="Sticky Note">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 3h18v18H3z"></path><path d="M12 8v8"></path><path d="M8 12h8"></path></svg>
    </button>
    <button class="tool" data-tool="image" title="Insert Image">
      <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
    </button>
    <input type="file" id="imageInput" accept="image/*" style="display: none;">
  </aside>

  <!-- PEN PROPERTIES POPOVER -->
  <div id="size-popover" class="properties-panel">
    <div class="prop-row">
      <label>Color</label>
      <input type="color" id="colorPicker" value="#ffffff">
    </div>
    <div class="prop-row">
      <label>Stroke Size: <span id="sizeValue">4px</span></label>
      <input type="range" id="sizePicker" min="1" max="50" value="4">
    </div>
    <div class="preview-container">
      <div id="sizePreviewCircle"></div>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
