<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartboard Canvas</title>
  <link rel="stylesheet" href="styles.css">
  <!-- jsPDF Library for Multi-page PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <!-- Primary Drawing Canvas -->
  <canvas id="board"></canvas>

  <!-- Hidden File Inputs -->
  <input type="file" id="imageInput" accept="image/*" class="hidden">
  <input type="file" id="projectInput" accept=".oxsb" class="hidden">

  <!-- Size Slider Popover -->
  <div id="size-popover" class="size-popover hidden">
    <div class="size-preview">
      <div id="sizePreviewCircle" class="size-preview-circle"></div>
    </div>
    <input type="range" id="sizePicker" min="1" max="50" value="4">
    <span id="sizeValue" style="font-size: 12px; font-weight: 600; color: #475569; min-width: 28px;">4px</span>
  </div>

  <!-- Main Floating Toolbar -->
  <div class="toolbar-container">
    
    <!-- Drawing & Selection Tools -->
    <div class="tool-group">
      <button class="tool active" data-tool="pen" title="Pen">🖊️</button>
      <button class="tool" data-tool="marker" title="Marker">✒️</button>
      <button class="tool" data-tool="highlighter" title="Highlighter">🖍️</button>
      <button class="tool" data-tool="eraser" title="Eraser">🧹</button>
      <button class="tool" data-tool="select" title="Select / Lasso">🔍</button>
    </div>

    <div class="divider"></div>

    <!-- Shapes & External Elements -->
    <div class="tool-group">
      <button class="tool" data-tool="line" title="Line">╱</button>
      <button class="tool" data-tool="rect" title="Rectangle">▭</button>
      <button class="tool" data-tool="circle" title="Circle">◯</button>
      <button class="tool" data-tool="text" title="Add Text">T</button>
      <button class="tool" data-tool="sticky" title="Sticky Note">📝</button>
      <button class="tool" data-tool="image" title="Insert Image">🖼️</button>
    </div>

    <div class="divider"></div>

    <!-- Color Picker & Board History -->
    <div class="tool-group">
      <input type="color" id="colorPicker" value="#000000" title="Choose Color">
      <button id="btnUndo" class="tool" title="Undo">↩️</button>
      <button id="btnRedo" class="tool" title="Redo">↪️</button>
      <button id="btnClear" class="tool" title="Clear Canvas">🗑️</button>
    </div>

    <div class="divider"></div>

    <!-- Multi-page Controls -->
    <div class="tool-group">
      <button id="btnPrevPage" class="tool disabled" title="Previous Page">◀</button>
      <span id="pageDisplay">1/1</span>
      <button id="btnNextPage" class="tool disabled" title="Next Page">▶</button>
      <button id="btnAddPage" class="tool" title="Add Page">➕</button>
    </div>

    <div class="divider"></div>

    <!-- Settings & Export Menus -->
    <div class="tool-group">
      
      <!-- Background Customizer -->
      <div class="settings-menu-container">
        <button id="btnSettings" class="tool" title="Board Settings">⚙️</button>
        <div id="settingsDropdownMenu" class="dropdown-menu hidden">
          <div class="menu-section-title">Background Color</div>
          <div class="menu-option-grid">
            <button id="bg-white" class="menu-btn">White</button>
            <button id="bg-black" class="menu-btn">Black</button>
            <button id="bg-green" class="menu-btn">Green</button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 4px; padding: 0 2px;">
            <span style="font-size: 12px; font-weight: 600; color: #475569;">Custom Color:</span>
            <input type="color" id="bg-custom" value="#ffffff">
          </div>

          <div class="menu-section-title" style="margin-top: 10px;">Pattern Overlay</div>
          <div class="menu-option-grid">
            <button id="pat-plain" class="menu-btn">Plain</button>
            <button id="pat-grid" class="menu-btn">Grid</button>
            <button id="pat-lines" class="menu-btn">Lines</button>
          </div>
        </div>
      </div>

      <!-- File Saving & Document Export -->
      <div class="export-menu-container">
        <button id="btnMainExport" class="tool" title="Export / Save">💾</button>
        <div id="exportDropdownMenu" class="dropdown-menu hidden">
          <div class="menu-section-title">Project File</div>
          <button id="btnSaveCurrent" class="menu-btn" style="text-align: left;">Save Current Page (.oxsb)</button>
          <button id="btnSaveAll" class="menu-btn" style="text-align: left;">Save Full Project (.oxsb)</button>
          <button id="btnOpenDoc" class="menu-btn" style="text-align: left;">Open Existing Document</button>

          <div class="menu-section-title" style="margin-top: 10px;">Document Export</div>
          <button id="btnExportPDF" class="menu-btn" style="text-align: left; background: #5d35ff; color: white;">Export Selection to PDF</button>
        </div>
      </div>

    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
