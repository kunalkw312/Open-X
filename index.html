<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Smartboard for Teachers</title>
  <link rel="stylesheet" href="styles.css">
  <!-- jsPDF for PDF export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

  <!-- MAIN CANVAS -->
  <canvas id="board"></canvas>

  <!-- HIDDEN FILE INPUTS -->
  <input type="file" id="imageInput" accept="image/png, image/jpeg, image/webp" style="display: none;">
  <input type="file" id="projectInput" accept=".oxsb" style="display: none;">

  <!-- TOP TOOLBAR -->
  <div class="toolbar top-toolbar">
    <!-- Pagination -->
    <div class="pagination-group">
      <button id="btnPrevPage" class="icon-btn disabled" title="Previous Page">◀</button>
      <span id="pageDisplay">1/1</span>
      <button id="btnNextPage" class="icon-btn disabled" title="Next Page">▶</button>
      <button id="btnAddPage" class="icon-btn" title="Add New Page">➕</button>
    </div>

    <!-- Undo / Redo / Clear -->
    <div class="action-group">
      <button id="btnUndo" class="icon-btn" title="Undo">↩️</button>
      <button id="btnRedo" class="icon-btn" title="Redo">↪️</button>
      <button id="btnClear" class="icon-btn danger" title="Clear Board">🗑️</button>
    </div>

    <!-- Right Menus (Export & Settings) -->
    <div class="menu-group">
      <!-- Export Menu -->
      <div class="dropdown-container">
        <button id="btnMainExport" class="icon-btn" title="Export / Import">💾</button>
        <div id="exportDropdownMenu" class="dropdown-menu hidden">
          <button id="btnSaveCurrent">Save Current Page (.oxsb)</button>
          <button id="btnSaveAll">Save Entire Project (.oxsb)</button>
          <button id="btnOpenDoc">Open Project (.oxsb)</button>
          <hr>
          <button id="btnExportPDF">Export to PDF</button>
        </div>
      </div>

      <!-- Settings Menu (New) -->
      <div class="dropdown-container">
        <button id="btnSettings" class="icon-btn" title="Settings">⋮</button>
        <div id="settingsMenu" class="dropdown-menu hidden">
          <div class="settings-section">
            <h4>Background Color</h4>
            <div class="color-options">
              <button id="btnBgWhite" class="bg-option" style="background: #ffffff; border: 1px solid #ccc;"></button>
              <button id="btnBgBlack" class="bg-option" style="background: #1e1e1e;"></button>
              <button id="btnBgGreen" class="bg-option" style="background: #2d5a27;"></button>
              <input type="color" id="customBgPicker" value="#ffffff" class="color-picker-small" title="Custom Background">
            </div>
          </div>
          <hr>
          <div class="settings-section">
            <h4>Background Pattern</h4>
            <div class="pattern-options">
              <button id="btnPatternPlain" class="btn-text">Plain</button>
              <button id="btnPatternGrid" class="btn-text">Gridlines</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- LEFT TOOLBAR (Drawing Tools) -->
  <div class="toolbar side-toolbar">
    <button class="tool active" data-tool="pen" title="Pen">✏️</button>
    <button class="tool" data-tool="marker" title="Marker">🖍️</button>
    <button class="tool" data-tool="highlighter" title="Highlighter">🖌️</button>
    <button class="tool" data-tool="eraser" title="Eraser">🧼</button>
    <hr class="toolbar-divider">
    <button class="tool" data-tool="select" title="Select / Move">🖱️</button>
    <button class="tool" data-tool="text" title="Text">🔠</button>
    <button class="tool" data-tool="sticky" title="Sticky Note">📝</button>
    <button class="tool" data-tool="image" title="Insert Image">🖼️</button>
    <hr class="toolbar-divider">
    <button class="tool" data-tool="line" title="Line">➖</button>
    <button class="tool" data-tool="rect" title="Rectangle">▭</button>
    <button class="tool" data-tool="circle" title="Circle">◯</button>
  </div>

  <!-- FLOATING SIZE/COLOR POPOVER -->
  <div id="size-popover" class="floating-panel">
    <div class="panel-row">
      <input type="color" id="colorPicker" value="#000000" title="Ink Color">
      <div class="preview-container">
        <div id="sizePreviewCircle"></div>
      </div>
    </div>
    <div class="panel-row">
      <input type="range" id="sizePicker" min="1" max="50" value="4">
      <span id="sizeValue">4px</span>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
