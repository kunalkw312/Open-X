<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smartboard Canvas</title>
  <link rel="stylesheet" href="styles.css">
  <!-- jsPDF Library for Multi-page PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Dynamic Theme Mapping & Popover Styles -->
  <style>
    :root {
      --tb-bg: rgba(255, 255, 255, 0.95);
      --tb-border: rgba(0, 0, 0, 0.1);
      --tb-text: #334155;
      --tb-icon: #475569;
      --tb-hover: rgba(0, 0, 0, 0.06);
    }
    
    .toolbar-container, .popover, .dropdown-menu, .page-card {
      background: var(--tb-bg) !important;
      border-color: var(--tb-border) !important;
      color: var(--tb-text) !important;
    }

    .tool, .menu-section-title {
      color: var(--tb-icon) !important;
    }

    .tool:hover, .menu-btn:hover {
      background: var(--tb-hover) !important;
    }
    
    .menu-btn {
      background: transparent !important;
      border-color: var(--tb-border) !important;
      color: var(--tb-text) !important;
    }

    /* Multi-Tap Popover Base */
    .popover {
      position: fixed;
      z-index: 10001;
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--tb-border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      pointer-events: auto; /* Allows interacting with slider/buttons */
    }

    /* The "V" Caret pointing down at the tool */
    .popover-arrow {
      position: absolute;
      bottom: -7px;
      left: 50%;
      transform: translateX(-50%) rotate(45deg);
      width: 14px;
      height: 14px;
      background: var(--tb-bg);
      border-right: 1px solid var(--tb-border);
      border-bottom: 1px solid var(--tb-border);
      z-index: -1;
    }

    /* Color Grid Styles */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .color-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: transform 0.1s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .color-btn:hover {
      transform: scale(1.1);
    }
  </style>
</head>
<body>

  <canvas id="board"></canvas>

  <input type="file" id="imageInput" accept="image/*" class="hidden">
  <input type="file" id="projectInput" accept=".oxsb" class="hidden">

  <!-- ========================================== -->
  <!-- DYNAMIC POPOVERS (Activated by Multi-Tap)  -->
  <!-- ========================================== -->

  <!-- Size Popover (Double Tap) -->
  <div id="size-popover" class="popover hidden">
    <div class="popover-arrow"></div>
    <div class="size-preview" style="width: 100px; height: 100px; display: flex; align-items: center; justify-content: center; margin-bottom: 8px;">
      <div id="sizePreviewCircle" class="size-preview-circle" style="border-radius: 50%; flex-shrink: 0; transition: width 0.05s, height 0.05s, background-color 0.1s;"></div>
    </div>
    <input type="range" id="sizePicker" min="1" max="100" value="4" style="width: 140px; cursor: pointer;">
    <span id="sizeValue" style="font-size: 16px; font-weight: 700; margin-top: 8px; text-align: center;">4px</span>
  </div>

  <!-- Color Popover (Triple Tap) -->
  <div id="color-popover" class="popover hidden">
    <div class="popover-arrow"></div>
    <div style="font-size: 12px; font-weight: 700; margin-bottom: 12px; color: var(--tb-text); text-transform: uppercase;">Tool Color</div>
    <div id="colorGrid" class="color-grid">
      <!-- Color buttons (and the rainbow shortcut) dynamically injected by app.js -->
    </div>
  </div>


  <!-- ========================================== -->
  <!-- MAIN TOOLBAR (Floating Bottom Center)      -->
  <!-- ========================================== -->
  <div class="toolbar-container toolbar-bottom" style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; padding: 8px 14px; gap: 8px; align-items: center; border-radius: 16px; backdrop-filter: blur(12px); box-shadow: 0 12px 32px rgba(0,0,0,0.18);">
    
    <!-- Drawing & Selection Tools -->
    <div class="tool-group">
      <button class="tool active" data-tool="pen" title="Pen (1 Tap: Select | 2 Taps: Size | 3 Taps: Color)">
        <svg viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>
      </button>
      <button class="tool" data-tool="marker" title="Marker (1 Tap: Select | 2 Taps: Size | 3 Taps: Color)">
        <svg viewBox="0 0 24 24"><path d="m15 5 4 4"/><path d="M13 7 8.7 2.7a2.41 2.41 0 0 0-3.4 0L2.7 5.3a2.41 2.41 0 0 0 0 3.4L7 13"/><path d="m8 6 2-2"/><path d="m18 16 2-2"/><path d="m17 11 4.3 4.3c.94.94.94 2.46 0 3.4l-2.6 2.6c-.94.94-2.46.94-3.4 0L11 17"/><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/></svg>
      </button>
      <button class="tool" data-tool="highlighter" title="Highlighter (1 Tap: Select | 2 Taps: Size | 3 Taps: Color)">
        <svg viewBox="0 0 24 24"><path d="m9 11-6 6v3h9l3-3"/><path d="m22 12-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>
      </button>
      <button class="tool" data-tool="eraser" title="Eraser (1 Tap: Select | 2 Taps: Size)">
        <svg viewBox="0 0 24 24"><path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
      </button>
      <button class="tool" data-tool="select" title="Select / Lasso">
        <svg viewBox="0 0 24 24"><path d="M3 3l7.07 16.97 2.51-7.39 7.39-2.51L3 3z"/><path d="M13 13l6 6"/></svg>
      </button>
    </div>

    <div class="divider" style="width: 1px; height: 24px; background-color: var(--tb-border); margin: 0 4px;"></div>

    <!-- Shape Tools -->
    <div class="tool-group">
      <button class="tool" data-tool="line" title="Line (1 Tap: Select | 2 Taps: Size | 3 Taps: Color)">
        <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5"></line></svg>
      </button>
      <button class="tool" data-tool="rect" title="Rectangle (1 Tap: Select | 2 Taps: Size | 3 Taps: Color)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
      </button>
      <button class="tool" data-tool="circle" title="Circle (1 Tap: Select | 2 Taps: Size | 3 Taps: Color)">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg>
      </button>
    </div>

    <div class="divider" style="width: 1px; height: 24px; background-color: var(--tb-border); margin: 0 4px;"></div>

    <!-- Actions, Save & More Menu -->
    <div class="tool-group">
      
      <!-- Native Color Picker (Now linked to the active tool + acts as the rainbow picker) -->
      <input type="color" id="colorPicker" value="#000000" title="Custom Rainbow Color" style="margin-right: 4px;">
      
      <button id="btnUndo" class="tool" title="Undo">
        <svg viewBox="0 0 24 24"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
      </button>
      <button id="btnRedo" class="tool" title="Redo">
        <svg viewBox="0 0 24 24"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
      </button>
      <button id="btnClear" class="tool" title="Clear Canvas">
        <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      </button>

      <!-- Save Button -->
      <div class="export-menu-container" style="position: relative;">
        <button id="btnMainExport" class="tool" title="Export / Save">
          <svg viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>
        </button>
        <div id="exportDropdownMenu" class="dropdown-menu hidden" style="width: 220px; bottom: 50px; left: -80px;">
          <div class="menu-section-title">Project File</div>
          <button id="btnSaveCurrent" class="menu-btn" style="text-align: left;">Save Current Page (.oxsb)</button>
          <button id="btnSaveAll" class="menu-btn" style="text-align: left;">Save Full Project (.oxsb)</button>
          <button id="btnOpenDoc" class="menu-btn" style="text-align: left;">Open Existing Document</button>
          <div class="menu-section-title" style="margin-top: 10px;">Document Export</div>
          <button id="btnExportPDF" class="menu-btn" style="text-align: left; background: var(--tb-text) !important; color: var(--tb-bg) !important; border: none !important;">Export Selection to PDF</button>
        </div>
      </div>

      <!-- Three Dot "More" Menu -->
      <div class="more-menu-container" style="position: relative;">
        <button id="btnMore" class="tool" title="More Options">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>
        </button>
        
        <div id="moreDropdownMenu" class="dropdown-menu hidden" style="width: 240px; bottom: 50px; left: -110px;">
          <div class="menu-section-title">Insert Media</div>
          <button class="menu-btn tool-trigger" data-tool="text" style="text-align: left; display: flex; align-items: center; gap: 8px;">
            <svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" y1="20" x2="15" y2="20"></line><line x1="12" y1="4" x2="12" y2="20"></line></svg>
            Add Text
          </button>
          <button class="menu-btn tool-trigger" data-tool="sticky" style="text-align: left; display: flex; align-items: center; gap: 8px;">
            <svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"></path><path d="M15 3v5h5"></path></svg>
            Sticky Note
          </button>
          <button class="menu-btn tool-trigger" data-tool="image" style="text-align: left; display: flex; align-items: center; gap: 8px;">
            <svg style="width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            Insert Image
          </button>

          <div class="menu-section-title" style="margin-top: 12px; border-top: 1px solid var(--tb-border); padding-top: 12px;">Background Color</div>
          <div class="menu-option-grid">
            <button id="bg-white" class="menu-btn">White</button>
            <button id="bg-black" class="menu-btn">Black</button>
            <button id="bg-green" class="menu-btn">Green</button>
          </div>
          <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px; padding: 0 4px;">
            <span style="font-size: 13px; font-weight: 600; color: var(--tb-text);">Custom Color:</span>
            <input type="color" id="bg-custom" value="#ffffff" style="border:none; width: 28px; height: 28px; border-radius: 50%; cursor: pointer;">
          </div>
          
          <div class="menu-section-title" style="margin-top: 12px;">Pattern Overlay</div>
          <div class="menu-option-grid">
            <button id="pat-plain" class="menu-btn">Plain</button>
            <button id="pat-grid" class="menu-btn">Grid</button>
            <button id="pat-lines" class="menu-btn">Lines</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ========================================== -->
  <!-- PAGE CONTROLS (Floating Bottom Right)      -->
  <!-- ========================================== -->
  <div class="toolbar-container toolbar-right" style="position: fixed; bottom: 20px; right: 20px; display: flex; padding: 8px 14px; gap: 8px; align-items: center; border-radius: 16px; backdrop-filter: blur(12px); box-shadow: 0 12px 32px rgba(0,0,0,0.18);">
    
    <div class="tool-group">
      <button id="btnPrevPage" class="tool disabled" title="Previous Page">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      
      <span id="pageDisplay" style="color: var(--tb-text); font-weight: 600; font-size: 14px; min-width: 40px; text-align: center;">1/1</span>
      
      <button id="btnNextPage" class="tool disabled" title="Next Page">
        <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </button>
      
      <div class="divider" style="width: 1px; height: 20px; background-color: var(--tb-border); margin: 0 8px;"></div>
      
      <button id="btnAddPage" class="tool" title="Add Page">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      </button>
    </div>

  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
